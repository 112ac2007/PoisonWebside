<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁範本</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 導覽列 -->
  <header class="navbar">
    <div class="logo">Logo</div>
    <nav class="menu">
      <a href="#">首頁</a>
      <a href="#">服務</a>
      <a href="#">最新消息</a>
      <a href="#">聯絡我們</a>
    </nav>
    <div class="icons">
      <span class="icon">👤</span>
      <span class="icon">🛒</span>
    </div>
  </header>

  <!-- 主視覺 -->
  <section class="hero">
    <div class="hero-banner">主視覺區塊</div>
    <p class="hero-subtitle">小小的改變，帶來無限不可能的力量</p>
  </section>

  <!-- 精選商品區 -->
  <section class="feature">
    <div class="feature-image">圖像</div>
    <div class="feature-text">
      <h2>無限可能</h2>
      <p>
        我們致力於為您帶來最好的產品，提供創新設計、高品質原料，並以使用者需求為出發點，打造屬於每一位顧客的理想選擇。
      </p>
      <button>探索更多</button>
    </div>
  </section>

  <!-- 熱門商品 -->
  <section class="products">
    <h2>熱門商品</h2>
    <div class="product-list">
      <div class="product-card">
        <div class="product-image">商品圖</div>
        <p>商品名稱</p>
        <p>$500</p>
      </div>
      <div class="product-card">
        <div class="product-image">商品圖</div>
        <p>商品名稱</p>
        <p>$500</p>
      </div>
      <div class="product-card">
        <div class="product-image">商品圖</div>
        <p>商品名稱</p>
        <p>$500</p>
      </div>
    </div>
    <button class="load-more">更多商品</button>
  </section>

  <!-- 頁尾 -->
  <footer class="footer">
    <div class="footer-contact">
      <p>電話：1234-5678</p>
      <p>地址：100台北市信義區</p>
      <p>Email：example@mail.com</p>
    </div>
    <div class="footer-links">
      <div>
        <h4>關於</h4>
        <p>品牌故事</p>
        <p>隱私權政策</p>
      </div>
      <div>
        <h4>協助</h4>
        <p>常見問題</p>
        <p>聯絡客服</p>
      </div>
    </div>
  </footer>

</body>
</html>
